# One address for sign-in (/auth/v1) and the database API (/rest/v1).
# The Supabase client libraries expect exactly these paths.

map $http_origin $cors_origin {
    default "";
    "~^https?://.+$" $http_origin;
}

server {
    listen 80;
    client_max_body_size 10m;

    # Answer browser pre-flight requests ourselves.
    set $cors_headers "authorization, x-client-info, apikey, content-type, content-profile, accept-profile, prefer, range, x-supabase-api-version";

    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    location /rest/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Expose-Headers "content-range, content-profile" always;
    }

    location = /healthz {
        return 200 "ok";
    }
}
